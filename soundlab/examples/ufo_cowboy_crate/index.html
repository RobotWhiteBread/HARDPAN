<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Crate demo: Roswell Ranch to Midnight Rodeo</title>
<style>
  :root { --bg:#07090d; --panel:#0f141c; --line:#232b38; --text:#dde3ec; --dim:#8794a6; --accent:#7aa2ff; --gold:#f2a93b; --open:#63e6be; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:17px; margin:0 6px 0 0; }
  input, select, button { background:#1b2533; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:3px 8px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); } button.on { background:#22304a; border-color:var(--accent); }
  #filters { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); }
  #filters label { color:var(--dim); font-size:12px; }
  #types button { padding:2px 8px; font-size:12px; margin-right:2px; }
  main { flex:1; display:flex; min-height:0; }
  #tree { width:380px; overflow:auto; border-right:1px solid var(--line); padding:6px 4px 30px; background:#0b0f15; }
  .tn { padding:2px 6px; border-radius:5px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; gap:6px; }
  .tn:hover { background:#18202c; } .tn.sel { background:#22304a; }
  .tn .tw { width:12px; color:var(--dim); flex:none; } .tn .c { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; padding-left:8px; }
  .lv0 { font-weight:600; }
  #right { flex:1; display:flex; flex-direction:column; min-width:0; }
  #summary { padding:6px 12px; color:var(--dim); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; }
  #summary b { color:var(--text); }
  #act { margin-left:auto; display:flex; gap:6px; }
  #head, .row { display:grid; grid-template-columns: 28px minmax(180px, 2.2fr) 90px 1.2fr 1.4fr 56px 52px 90px repeat(4, 46px) 44px; gap:6px; align-items:center; padding:0 10px; }
  #head { height:28px; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--line); }
  #head span { cursor:pointer; white-space:nowrap; overflow:hidden; } #head span:hover { color:var(--text); } #head span.s { color:var(--gold); }
  #scroll { flex:1; overflow:auto; position:relative; }
  #rows { position:relative; }
  .row { height:26px; position:absolute; left:0; right:0; cursor:pointer; border-bottom:1px solid #121822; }
  .row:hover { background:#141b26; } .row.sel { background:#22304a; }
  .row span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .d { color:var(--dim); } .bar { height:6px; background:#1a2230; border-radius:3px; position:relative; }
  .bar i { position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:3px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  #status { color:var(--gold); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>My Crate <span style="color:var(--gold);font-weight:400">demo</span></h1>
  <span class="hint" style="color:var(--dim)">A made-up crate: five invented vendors of UFO and cowboy sounds, all synthesized for this demo and measured by the real soundlab pipeline. Click a row to hear it, use the arrow keys to walk the list.</span>
  <span id="status"></span>
</header>
<div id="filters">
  <input id="q" placeholder="search names and folders (808, vinyl, rhodes...)" style="width:260px">
  <span id="types"></span>
  <label>Key <select id="key"><option value="">any</option></select></label>
  <label>BPM <input id="bmin" type="number" style="width:58px" placeholder="min"> to <input id="bmax" type="number" style="width:58px" placeholder="max"></label>
  <label>Character <select id="char"><option value="">any</option></select></label>
  <label>Used in my songs <select id="used"><option value="">either</option><option value="1">used</option><option value="0">never used</option></select></label>
  <label>Length <select id="len"><option value="">any</option><option value="short">one-shots</option><option value="loop">loops (has bars)</option><option value="long">long</option></select></label>
  <label><input type="checkbox" id="oneEach"> one of each (hide copies)</label>
  <button id="reset">Reset</button>
</div>
<main>
  <div id="tree"></div>
  <div id="right">
    <div id="summary"><span id="count"></span><span id="mix"></span>
      <div id="act"><button id="cartBtn" title="Add the selected sound to your active Galaxy cart">Add to cart</button><button id="padBtn">Send to Voice Pads</button><button id="copyBtn">Copy path</button><button id="csvBtn" title="Download the current list as a spreadsheet">Export list (CSV)</button></div></div>
    <div id="head"></div>
    <div id="scroll"><div id="rows"></div></div>
  </div>
</main>
<script src="galaxy_data.js" onerror="window.GALAXY=null"></script>
<script>
"use strict";
const G = window.GALAXY, $ = id => document.getElementById(id);
if (!G) { $("status").textContent = "No Galaxy data yet: run  py soundlab.py galaxy"; throw new Error("no data"); }
const N = G.count, SERVE = location.protocol.startsWith("http");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TYPE_LABEL = { kick: "Kicks", snare_clap: "Snares and claps", hat: "Hats", perc: "Perc", bass: "Bass", melodic: "Melodic", loop: "Loops", texture: "Texture", fx_noise: "FX and noise", other: "Other" };
const TYPE_COLOR = { kick: "#ff5a4e", snare_clap: "#ffb347", hat: "#fff27a", perc: "#c58bff", bass: "#4ea8ff", melodic: "#4ef0b0", loop: "#ff7bd5", texture: "#8fa3b8", fx_noise: "#7ee0ff", other: "#666" };
const pathOf = i => G.dirs[G.d[i]] + G.n[i];
const vendorOf = p => G.packs[p].split("|")[0].trim() || "Other", packOf = p => (G.packs[p].split("|")[1] || G.packs[p]).trim() || "(no pack name)";
const used = new Set(Object.keys(G.use || {}).map(Number));

// ---------- folder under each pack: strip the part of the path that every file in the pack shares
const packRoot = new Map();
for (let i = 0; i < N; i++) { const p = G.p[i], d = G.dirs[G.d[i]]; const r = packRoot.get(p);
  if (r === undefined) packRoot.set(p, d); else if (!d.startsWith(r)) { let k = 0; while (k < r.length && r[k] === d[k]) k++; packRoot.set(p, r.slice(0, Math.max(r.lastIndexOf("\\", k - 1), r.lastIndexOf("/", k - 1)) + 1)); } }
const folderOfDir = new Map();
const folderOf = i => { const d = G.d[i]; let f = folderOfDir.get(d); if (f === undefined) { const r = packRoot.get(G.p[i]) || ""; f = G.dirs[d].slice(r.length).replace(/[\\/]+$/, "").replace(/[\\/]/g, " / "); folderOfDir.set(d, f); } return f; };

// ---------- tree: vendor > pack > folders
const tree = { kids: new Map(), n: 0 };
for (let i = 0; i < N; i++) {
  const parts = [vendorOf(G.p[i]), packOf(G.p[i]), ...folderOf(i).split(" / ").filter(Boolean)];
  let node = tree; node.n++;
  parts.forEach((name, lv) => { if (!node.kids.has(name)) node.kids.set(name, { name, kids: new Map(), n: 0, lv, path: (node.path ? node.path + "\u0001" : "") + name, open: false }); node = node.kids.get(name); node.n++; });
}
let treeSel = "";
const pathKey = i => [vendorOf(G.p[i]), packOf(G.p[i]), ...folderOf(i).split(" / ").filter(Boolean)].join("\u0001");
const keyCache = new Array(N);
function drawTree() {
  const out = [];
  const walk = (node) => {
    const kids = [...node.kids.values()].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    for (const k of kids) {
      out.push(`<div class="tn lv${k.lv}${treeSel === k.path ? " sel" : ""}" data-p="${esc(k.path)}" style="padding-left:${6 + k.lv * 14}px"><span class="tw">${k.kids.size ? (k.open ? "▾" : "▸") : ""}</span><span style="overflow:hidden;text-overflow:ellipsis">${esc(k.name)}</span><span class="c">${k.n.toLocaleString()}</span></div>`);
      if (k.open) walk(k);
    }
  };
  out.push(`<div class="tn lv0${treeSel === "" ? " sel" : ""}" data-p=""><span class="tw"></span><span>Everything</span><span class="c">${N.toLocaleString()}</span></div>`);
  walk(tree); $("tree").innerHTML = out.join("");
}
function findNode(path) { let n = tree; for (const part of path.split("\u0001")) { n = n.kids.get(part); if (!n) return null; } return n; }
$("tree").onclick = e => { const el = e.target.closest(".tn"); if (!el) return; const p = el.dataset.p;
  if (p) { const n = findNode(p); if (n && (treeSel === p || e.target.classList.contains("tw"))) n.open = !n.open; else if (n) n.open = true; }
  treeSel = p; drawTree(); apply(); };

// ---------- filters
$("types").innerHTML = G.types.map((t, k) => `<button data-t="${k}"><span class="dot" style="background:${TYPE_COLOR[t] || "#666"}"></span> ${TYPE_LABEL[t] || t}</button>`).join("");
const typeOn = new Set();
$("types").onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = +b.dataset.t; typeOn.has(k) ? typeOn.delete(k) : typeOn.add(k); b.classList.toggle("on"); apply(); };
$("key").innerHTML += G.keys.map((k, i) => `<option value="${i}">${k}</option>`).join("");
const words = [...new Set(G.chars.flatMap(c => c.split(" ")).filter(Boolean))].sort();
$("char").innerHTML += words.map(w => `<option>${w}</option>`).join("");
["q", "key", "bmin", "bmax", "char", "used", "len", "oneEach"].forEach(id => $(id).addEventListener(id === "q" ? "input" : "change", apply));
$("reset").onclick = () => { ["q", "key", "bmin", "bmax", "char", "used", "len"].forEach(id => $(id).value = ""); $("oneEach").checked = false; typeOn.clear(); document.querySelectorAll("#types button").forEach(b => b.classList.remove("on")); treeSel = ""; drawTree(); apply(); };

// ---------- columns and sorting
const F = G.feats;
const COLS = [
  { k: "play", label: "" }, { k: "name", label: "Name", v: i => G.n[i].toLowerCase() }, { k: "type", label: "Type", v: i => G.types[G.t[i]] },
  { k: "pack", label: "Pack", v: i => G.packs[G.p[i]].toLowerCase() }, { k: "folder", label: "Folder", v: i => folderOf(i).toLowerCase() },
  { k: "bpm", label: "BPM", v: i => G.bpm[i] || 0 }, { k: "key", label: "Key", v: i => G.key[i] }, { k: "char", label: "Character", v: i => G.chars[G.ch[i]] || "" },
  { k: "bright", label: "Bright", v: i => F.bright[i] }, { k: "punch", label: "Punch", v: i => F.punch[i] }, { k: "body", label: "Low end", v: i => F.body[i] },
  { k: "length", label: "Length", v: i => F.length[i] }, { k: "used", label: "Used", v: i => used.has(i) ? 1 : 0 },
];
let sortK = "pack", sortDir = 1;
$("head").innerHTML = COLS.map(c => `<span data-k="${c.k}" title="Sort">${c.label}</span>`).join("");
$("head").onclick = e => { const k = e.target.dataset.k; if (!k || k === "play") return; if (sortK === k) sortDir = -sortDir; else { sortK = k; sortDir = 1; } apply(); };

let list = [], sel = -1;
function apply() {
  const q = $("q").value.toLowerCase().trim().split(/\s+/).filter(Boolean), key = $("key").value, bmin = +$("bmin").value || 0, bmax = +$("bmax").value || 0;
  const ch = $("char").value, us = $("used").value, ln = $("len").value, one = $("oneEach").checked;
  const out = [];
  for (let i = 0; i < N; i++) {
    if (typeOn.size && !typeOn.has(G.t[i])) continue;
    if (key !== "" && G.key[i] !== +key) continue;
    if (bmin && !(G.bpm[i] >= bmin)) continue; if (bmax && !(G.bpm[i] && G.bpm[i] <= bmax)) continue;
    if (ch && !(" " + (G.chars[G.ch[i]] || "") + " ").includes(" " + ch + " ")) continue;
    if (us === "1" && !used.has(i)) continue; if (us === "0" && used.has(i)) continue;
    if (ln === "short" && F.length[i] > 110) continue; if (ln === "loop" && !G.bars[i]) continue; if (ln === "long" && F.length[i] < 200) continue;
    if (one && G.fam && G.fam[i] !== i) continue;
    if (treeSel) { const kk = keyCache[i] || (keyCache[i] = pathKey(i)); if (kk !== treeSel && !kk.startsWith(treeSel + "\u0001")) continue; }
    if (q.length) { const hay = (G.n[i] + " " + G.packs[G.p[i]] + " " + folderOf(i)).toLowerCase(); if (!q.every(w => hay.includes(w))) continue; }
    out.push(i);
  }
  const col = COLS.find(c => c.k === sortK), v = col.v;
  out.sort((a, b) => { const x = v(a), y = v(b); return (x < y ? -1 : x > y ? 1 : (G.n[a] < G.n[b] ? -1 : 1)) * sortDir; });
  list = out;
  document.querySelectorAll("#head span").forEach(s => { s.classList.toggle("s", s.dataset.k === sortK); s.textContent = COLS.find(c => c.k === s.dataset.k).label + (s.dataset.k === sortK ? (sortDir > 0 ? " ▲" : " ▼") : ""); });
  $("count").innerHTML = `<b>${list.length.toLocaleString()}</b> sounds`;
  const byT = new Map(); for (const i of list) byT.set(G.t[i], (byT.get(G.t[i]) || 0) + 1);
  $("mix").innerHTML = [...byT].sort((a, b) => b[1] - a[1]).map(([t, n]) => `<span><span class="dot" style="background:${TYPE_COLOR[G.types[t]] || "#666"}"></span> ${TYPE_LABEL[G.types[t]] || G.types[t]} ${n.toLocaleString()}</span>`).join(" ");
  $("rows").style.height = list.length * 26 + "px"; $("scroll").scrollTop = 0; draw();
}
const bar = v => `<div class="bar"><i style="width:${Math.round(v / 2.55)}%"></i></div>`;
function draw() {
  const sc = $("scroll"), a = Math.max(0, Math.floor(sc.scrollTop / 26) - 10), b = Math.min(list.length, a + Math.ceil(sc.clientHeight / 26) + 20);
  let h = "";
  for (let r = a; r < b; r++) { const i = list[r], t = G.types[G.t[i]];
    h += `<div class="row${i === sel ? " sel" : ""}" data-i="${i}" style="top:${r * 26}px"><span>▶</span><span title="${esc(pathOf(i))}">${esc(G.n[i])}</span>
      <span><span class="dot" style="background:${TYPE_COLOR[t] || "#666"}"></span> ${TYPE_LABEL[t] || t}</span><span class="d" title="${esc(G.packs[G.p[i]])}">${esc(packOf(G.p[i]))}</span>
      <span class="d" title="${esc(folderOf(i))}">${esc(folderOf(i))}</span><span>${G.bpm[i] || ""}</span><span>${G.key[i] >= 0 ? G.keys[G.key[i]] : ""}</span>
      <span class="d">${esc(G.chars[G.ch[i]] || "")}</span>${bar(F.bright[i])}${bar(F.punch[i])}${bar(F.body[i])}${bar(F.length[i])}<span>${used.has(i) ? "yes" : ""}</span></div>`; }
  $("rows").innerHTML = h;
}
$("scroll").addEventListener("scroll", () => requestAnimationFrame(draw));
addEventListener("resize", draw);

// ---------- listen and act
const audio = new Audio();
const urlOf = i => G.demo ? encodeURI(pathOf(i)).replace(/#/g, "%23") : SERVE ? "/audio?p=" + encodeURIComponent(pathOf(i)) : "file:///" + encodeURI(pathOf(i).replace(/\\/g, "/")).replace(/#/g, "%23");
function choose(i) { sel = i; draw(); audio.pause(); audio.src = urlOf(i); audio.play().catch(() => $("status").textContent = G.demo ? "Click the page once, then try again." : "To hear sounds here, open it through  py soundlab.py serve"); }
$("rows").onclick = e => { const r = e.target.closest(".row"); if (r) choose(+r.dataset.i); };
$("rows").ondblclick = () => $("cartBtn").click();
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || !list.length) return;
  const at = list.indexOf(sel);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = Math.max(0, Math.min(list.length - 1, at + (e.key === "ArrowDown" ? 1 : -1))); choose(list[n]);
    const sc = $("scroll"); if (n * 26 < sc.scrollTop || n * 26 > sc.scrollTop + sc.clientHeight - 30) sc.scrollTop = n * 26 - sc.clientHeight / 2; }
  if (e.key === "Enter" && sel >= 0) $("cartBtn").click();
});
$("cartBtn").onclick = () => {
  if (sel < 0) return;
  let c; try { c = JSON.parse(localStorage.getItem("soundlab_carts") || "null"); } catch (e) {}
  c = c || { carts: { "My cart": [] }, active: "My cart", stars: [] }; c.carts = c.carts || {}; const a = c.active || "My cart"; c.carts[a] = c.carts[a] || [];
  if (!c.carts[a].includes(pathOf(sel))) c.carts[a].push(pathOf(sel));
  try { localStorage.setItem("soundlab_carts", JSON.stringify(c)); } catch (e) {}
  $("status").textContent = `Added ${G.n[sel]} to the "${a}" cart.`;
};
$("padBtn").onclick = () => { if (sel < 0) return; try { localStorage.setItem("soundlab_voice_inbox", JSON.stringify({ path: pathOf(sel), at: Date.now() })); } catch (e) {} $("status").textContent = `Sent ${G.n[sel]} to Voice Pads.`; };
$("copyBtn").onclick = () => { if (sel < 0) return; navigator.clipboard.writeText(pathOf(sel)).then(() => $("status").textContent = "Path copied.", () => {}); };
$("csvBtn").onclick = () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [["Name", "Type", "Vendor", "Pack", "Folder", "BPM", "Key", "Character", "Brightness", "Punch", "Low end", "Length", "Used in my songs", "Path"].map(q).join(",")];
  for (const i of list) rows.push([G.n[i], TYPE_LABEL[G.types[G.t[i]]] || G.types[G.t[i]], vendorOf(G.p[i]), packOf(G.p[i]), folderOf(i), G.bpm[i] || "", G.key[i] >= 0 ? G.keys[G.key[i]] : "",
    G.chars[G.ch[i]] || "", F.bright[i], F.punch[i], F.body[i], F.length[i], used.has(i) ? "yes" : "", pathOf(i)].map(q).join(","));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + rows.join("\r\n")], { type: "text/csv" })); a.download = "my_crate.csv"; a.click();
};

drawTree(); apply();
</script>
</body>
</html>
