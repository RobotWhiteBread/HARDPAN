<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mix Check</title>
<style>
  :root { --bg:#07090d; --card:#0e121a; --line:#232b38; --text:#d9e1ec; --dim:#7c8798; --good:#4ef0b0; --watch:#f2c94c; --fix:#ff5a4e; --accent:#f2a93b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,Segoe UI,sans-serif; }
  header { padding:18px 24px 6px; }
  h1 { margin:0; font-size:18px; letter-spacing:.08em; }
  .sub { color:var(--dim); }
  #terrain { width:100%; height:56vh; display:block; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .wrap { padding:16px 24px 40px; display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin:0 0 10px; }
  .check { display:grid; grid-template-columns:1fr auto 54px; gap:4px 10px; align-items:center; padding:7px 0; border-bottom:1px solid #161c26; cursor:pointer; }
  .check:last-child { border:0; }
  .check .why { grid-column:1 / -1; color:var(--dim); font-size:12px; display:none; }
  .check.open .why { display:block; }
  .pill { font-size:11px; font-weight:700; text-align:center; border-radius:10px; padding:1px 0; color:#111; }
  .good { background:var(--good); } .watch { background:var(--watch); } .fix { background:var(--fix); }
  .legend { color:var(--dim); font-size:12px; margin-top:8px; }
  svg text { fill:var(--dim); font-size:11px; }
  .hint { position:absolute; right:24px; margin-top:-30px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>MIX CHECK</h1>
  <div class="sub" id="sub"></div>
</header>
<canvas id="terrain"></canvas>
<div class="hint">3D spectrogram: time runs left to right, low notes at the front, height and color are loudness. Drag to spin.</div>
<div class="wrap">
  <div class="card"><h2>Checks <span style="text-transform:none;letter-spacing:0">(tap a row for why)</span></h2><div id="checks"></div></div>
  <div class="card"><h2>Tonal balance</h2><svg id="tonal" width="100%" height="230"></svg><div class="legend" id="tonalNote"></div></div>
  <div class="card"><h2>Loudness over time</h2><svg id="curve" width="100%" height="200"></svg><div class="legend">Short-term loudness (3 second windows). Hooks should rise above verses; a flat line means no build.</div></div>
  <div class="card" id="clashCard" style="display:none"><h2>Kick and bass</h2><div id="clash"></div></div>
</div>

<script>window.MIX = /*DATA*/null;</script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
const D = window.MIX, $ = id => document.getElementById(id);
$("sub").textContent = `${D.file}  ·  ${D.seconds} s  ·  ${D.sr} Hz  ·  sample peak ${D.peak} dBFS`;

// ---------- checks ----------
for (const [name, val, state, why] of D.checks) {
  const d = document.createElement("div"); d.className = "check";
  d.innerHTML = `<span>${name}</span><b>${val}</b><span class="pill ${state}">${state}</span><div class="why">${why}</div>`;
  d.onclick = () => d.classList.toggle("open"); $("checks").appendChild(d);
}

// ---------- tonal balance ----------
{
  const svg = $("tonal"), W = svg.clientWidth || 360, H = 230, L = 86, R = 20, T = 10, rowH = (H - T - 24) / D.tonal.length;
  const lo = Math.min(...D.tonal.map(t => Math.min(t.db, t.lo))) - 2, hi = Math.max(...D.tonal.map(t => Math.max(t.db, t.hi))) + 2;
  const x = v => L + (v - lo) / (hi - lo) * (W - L - R);
  let s = "";
  D.tonal.forEach((t, i) => {
    const y = T + i * rowH + rowH / 2, c = t.state === "good" ? "var(--good)" : "var(--fix)";
    s += `<text x="0" y="${y + 4}">${t.band}</text>`;
    s += `<rect x="${x(t.lo)}" y="${y - 7}" width="${x(t.hi) - x(t.lo)}" height="14" rx="4" fill="#1a2230"/>`;
    s += `<circle cx="${x(t.db)}" cy="${y}" r="6" fill="${c}"/>`;
    s += `<text x="${W - R + 4}" y="${y + 4}" text-anchor="end" style="fill:${c}">${t.state === "good" ? "" : t.state}</text>`;
  });
  for (let v = Math.ceil(lo / 5) * 5; v <= hi; v += 5) s += `<text x="${x(v)}" y="${H - 6}" text-anchor="middle">${v}</text>`;
  svg.innerHTML = s;
  $("tonalNote").textContent = `Dot = your mix, bar = target range from ${D.tonal_source}. dB = share of total energy. Add reference tracks with --refs for a real target.`;
}

// ---------- loudness curve ----------
{
  const svg = $("curve"), W = svg.clientWidth || 360, H = 200, c = D.curve.filter(v => v > -70);
  if (c.length > 1) {
    const lo = Math.floor(Math.min(...c) - 2), hi = Math.ceil(Math.max(...c) + 2), n = D.curve.length;
    const x = i => 34 + i / (n - 1) * (W - 44), y = v => 10 + (hi - v) / (hi - lo) * (H - 34);
    let p = D.curve.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(Math.max(v, lo)).toFixed(1)}`).join(" ");
    let s = `<path d="${p}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
    for (let v = lo; v <= hi; v += Math.max(2, Math.round((hi - lo) / 4))) s += `<text x="0" y="${y(v) + 4}">${v}</text><line x1="34" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="#161c26"/>`;
    const secs = D.curve.length * D.curve_hop;
    for (let t = 0; t <= secs; t += secs > 240 ? 60 : 30) s += `<text x="${x(t / D.curve_hop)}" y="${H - 6}" text-anchor="middle">${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}</text>`;
    svg.innerHTML = s;
  }
}

// ---------- clash ----------
if (D.clash) {
  const c = D.clash; $("clashCard").style.display = "block";
  const same = Math.abs(c.kick_peak_hz - c.bass_peak_hz) < 15;
  $("clash").innerHTML = `<p>Kick is strongest around <b>${c.kick_peak_hz} Hz</b>, bass around <b>${c.bass_peak_hz} Hz</b>. They are both loud at the same time in <b>${c.overlap_pct}%</b> of the song, worst near <b>${c.worst_hz} Hz</b>.</p>
  <p class="legend">${c.overlap_pct > 35 || same ? `Try one of these: sidechain the bass to the kick (fast duck, 40 to 80 ms release), or cut 2 to 4 dB at ${c.worst_hz} Hz on the bass and let the kick own it, or tune the kick so its peak sits away from the bass note.` : "Low end is sharing the space well."}</p>`;
}

// ---------- 3D terrain ----------
const canvas = $("terrain"), renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
camera.position.set(-60, 70, 110);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.4;
canvas.addEventListener("pointerdown", () => controls.autoRotate = false);
const Z = D.spec.z, F = Z.length, T = Z[0].length, Wd = 160, Dp = 80, Ht = 26;
const geo = new THREE.PlaneGeometry(Wd, Dp, T - 1, F - 1); geo.rotateX(-Math.PI / 2);
const P = geo.attributes.position, colors = new Float32Array(P.count * 3), c = new THREE.Color();
for (let fi = 0; fi < F; fi++) for (let ti = 0; ti < T; ti++) {
  const idx = fi * T + ti, v = Z[F - 1 - fi][ti];
  P.setY(idx, v * v * Ht);
  c.setHSL(0.68 - v * 0.68, 0.85, 0.12 + v * 0.5); colors.set([c.r, c.g, c.b], idx * 3);
}
geo.setAttribute("color", new THREE.BufferAttribute(colors, 3)); geo.computeVertexNormals();
scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.DoubleSide })));
scene.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo), new THREE.LineBasicMaterial({ color:0x000000, transparent:true, opacity:.12 })));
function label(text, x, z) {
  const cv = document.createElement("canvas"); cv.width = 256; cv.height = 64; const g = cv.getContext("2d");
  g.fillStyle = "#7c8798"; g.font = "28px system-ui"; g.fillText(text, 4, 40);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv), transparent:true }));
  s.position.set(x, 1, z); s.scale.set(16, 4, 1); scene.add(s);
}
const fr = D.spec.freqs, zOf = hz => { let i = fr.findIndex(f => f >= hz); if (i < 0) i = F - 1; return Dp / 2 - (i / (F - 1)) * Dp; };
for (const [hz, t] of [[60, "60 Hz"], [250, "250"], [1000, "1k"], [4000, "4k"], [12000, "12k"]]) label(t, -Wd / 2 - 12, zOf(hz));
label("0:00", -Wd / 2, Dp / 2 + 6);
const sec = D.spec.seconds; label(`${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, "0")}`, Wd / 2 - 6, Dp / 2 + 6);
function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
